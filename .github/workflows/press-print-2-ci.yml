name: MixMatter Research CI

on:
  pull_request:
    paths:
      - "docs/**"
      - "submission/openai/**"
      - "skills/press-print/**"
      - "skills/mixmatter/**"
      - "plugin.json"
      - ".codex-plugin/**"
      - "assets/mixmatter-icon-*.svg"
      - ".github/workflows/press-print-2-ci.yml"
      - ".github/workflows/mixmatter-openai-package.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "skills/press-print/**"
      - "skills/mixmatter/**"
      - "plugin.json"
      - ".codex-plugin/**"
      - "assets/mixmatter-icon-*.svg"
      - ".github/workflows/press-print-2-ci.yml"
      - ".github/workflows/mixmatter-openai-package.yml"

permissions:
  contents: read

jobs:
  validate-mcp-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate MixMatter research state
        shell: bash
        run: |
          test -f docs/MIXMATTER_2_RUNTIME.md
          test -f docs/system/MIXMATTER_ART_DIRECTION_POLICY.md
          test -f docs/system/MIXMATTER_CORE_CONSTITUTION.md
          test -f docs/system/MIXMATTER_REGRESSION_BENCHMARK.md
          test -f docs/system/MIXMATTER_SYSTEM_SCHEMA.yaml
          test -f docs/system/MIXMATTER_TOOL_SPEC.md
          test -f docs/system/MIXMATTER_VISUAL_GRAMMAR.md
          test -f skills/mixmatter/SKILL.md
          test -f plugin.json
          test -f .codex-plugin/plugin.json
          test -f assets/mixmatter-icon-light.svg
          test -f assets/mixmatter-icon-dark.svg
          python - <<'PY'
          import json
          from pathlib import Path
          root = json.loads(Path("plugin.json").read_text())
          compat = json.loads(Path(".codex-plugin/plugin.json").read_text())
          assert root["name"] == "mixmatter"
          assert root["version"] == "2.1.1"
          iface = root["extensions"]["com.openai"]["interface"]
          assert iface["displayName"] == "MixMatter"
          assert iface["websiteURL"].endswith("/mixmatter/")
          assert iface["composerIcon"] == "./assets/mixmatter-icon-light.svg"
          assert compat["name"] == "mixmatter"
          PY
          test ! -d apps/mixmatter-chatgpt
