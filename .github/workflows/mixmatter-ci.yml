name: MixMatter CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate MixMatter repository state
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          required = [
              "SKILL.md",
              "skills/mixmatter/SKILL.md",
              "skills/mixmatter/references/mixmatter-v1.md",
              "skills/mixmatter/references/quality-rubric.md",
              "prompt/mixmatter-v1.md",
              "eval/quality-rubric.md",
              "plugin.json",
              ".codex-plugin/plugin.json",
              ".claude-plugin/plugin.json",
              ".claude-plugin/marketplace.json",
              ".agents/plugins/marketplace.json",
              "assets/mixmatter-icon-light.svg",
              "assets/mixmatter-icon-dark.svg",
              "docs/MIXMATTER_2_RUNTIME.md",
              "docs/system/MIXMATTER_ART_DIRECTION_POLICY.md",
              "docs/system/MIXMATTER_CORE_CONSTITUTION.md",
              "docs/system/MIXMATTER_REGRESSION_BENCHMARK.md",
              "docs/system/MIXMATTER_SYSTEM_SCHEMA.yaml",
              "docs/system/MIXMATTER_TOOL_SPEC.md",
              "docs/system/MIXMATTER_VISUAL_GRAMMAR.md",
              "LICENSE",
          ]
          for path in required:
              assert Path(path).is_file(), f"missing {path}"
          assert not Path("apps/mixmatter-chatgpt").exists()

          # One version and one name across every manifest.
          root = json.loads(Path("plugin.json").read_text())
          codex = json.loads(Path(".codex-plugin/plugin.json").read_text())
          claude = json.loads(Path(".claude-plugin/plugin.json").read_text())
          market = json.loads(Path(".claude-plugin/marketplace.json").read_text())
          json.loads(Path(".agents/plugins/marketplace.json").read_text())

          version = root["version"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), version
          for name, manifest in [("codex", codex), ("claude", claude)]:
              assert manifest["name"] == "mixmatter", name
              assert manifest["version"] == version, f"{name} version {manifest['version']} != {version}"
          entry = next(p for p in market["plugins"] if p["name"] == "mixmatter")
          assert entry["source"] == "./"
          assert entry["version"] == version, f"marketplace version {entry['version']} != {version}"

          iface = root["extensions"]["com.openai"]["interface"]
          assert root["name"] == "mixmatter"
          assert iface["displayName"] == "MixMatter"
          assert iface["websiteURL"].endswith("/mixmatter/")
          assert iface["composerIcon"] == "./assets/mixmatter-icon-light.svg"

          changelog = Path("CHANGELOG.md").read_text()
          assert f"## {version} " in changelog, f"CHANGELOG.md has no entry for {version}"

          package_yml = Path(".github/workflows/mixmatter-openai-package.yml").read_text()
          assert f'"{version}"' in package_yml and f"mixmatter-openai-{version}" in package_yml, \
              "package workflow version is out of sync with plugin.json"

          # Mirrors must match the packaged canonical copies byte for byte.
          mirrors = {
              "prompt/mixmatter-v1.md": "skills/mixmatter/references/mixmatter-v1.md",
              "eval/quality-rubric.md": "skills/mixmatter/references/quality-rubric.md",
          }
          for mirror, canonical in mirrors.items():
              assert Path(mirror).read_bytes() == Path(canonical).read_bytes(), \
                  f"{mirror} is out of sync with {canonical}"

          # Skill frontmatter must stay loadable.
          for path in ["SKILL.md", "skills/mixmatter/SKILL.md"]:
              text = Path(path).read_text()
              match = re.match(r"---\nname: mixmatter\ndescription: >-\n((?:  .*\n)+)---\n", text)
              assert match, f"{path}: bad frontmatter"
              description = " ".join(line.strip() for line in match.group(1).splitlines())
              assert len(description) <= 1024, f"{path}: description is {len(description)} chars"

          # Retired names and URLs must not reappear outside the changelog history.
          tracked = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split()
          stale = ["Press Print", "Press-Print", "galok.me/press-print", "Fanjiale-CN/", "Mixmatter", "mixmatter-v2-runtime"]
          for path in tracked:
              if path in ("CHANGELOG.md",) or path.startswith(".github/") or not path.endswith((".md", ".json", ".yaml", ".svg")):
                  continue
              text = Path(path).read_text(errors="ignore")
              for needle in stale:
                  assert needle not in text, f"stale identity {needle!r} in {path}"
          PY
